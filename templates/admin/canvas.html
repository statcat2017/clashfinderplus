{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  #canvas-wrapper { display: flex; height: calc(100vh - 40px); }
  #canvas-sidebar { width: 280px; background: #f8f9fa; border-right: 1px solid #dee2e6; overflow-y: auto; padding: 15px; flex-shrink: 0; }
  #canvas-main { flex: 1; position: relative; }
  #canvas { width: 100%; height: 100%; }
  #canvas-toolbar { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; }
  .toolbar-btn { padding: 6px 12px; background: #fff; border: 1px solid #dee2e6; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .toolbar-btn:hover { background: #e9ecef; }
  #canvas-inspector { position: absolute; right: 10px; top: 10px; width: 300px; background: #fff; border: 1px solid #dee2e6; border-radius: 6px; padding: 15px; display: none; max-height: 80vh; overflow-y: auto; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  #canvas-search { position: absolute; top: 50px; left: 10px; z-index: 10; }
  #canvas-search input { padding: 6px 10px; border: 1px solid #dee2e6; border-radius: 4px; width: 180px; font-size: 13px; }
  #canvas-status { position: absolute; bottom: 10px; left: 10px; z-index: 10; font-size: 12px; color: #666; background: rgba(255,255,255,0.9); padding: 4px 10px; border-radius: 4px; }
  .filter-group { margin-bottom: 12px; }
  .filter-group label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 3px; }
  .filter-group select, .filter-group input { width: 100%; padding: 5px; font-size: 12px; border: 1px solid #dee2e6; border-radius: 3px; }
  .artist-list-item { padding: 6px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; }
  .artist-list-item:hover { background: #e9ecef; }
  .inspector-section { margin-bottom: 12px; }
  .inspector-section h4 { font-size: 13px; margin: 0 0 6px; color: #495057; }
  .toast { position: fixed; bottom: 60px; right: 20px; background: #333; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 13px; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
  .toast.show { opacity: 1; }
</style>
{% endblock %}

{% block content %}
<div id="canvas-wrapper">
  <div id="canvas-sidebar">
    <h3 style="margin:0 0 10px;font-size:15px;">Artists</h3>
    <div class="filter-group">
      <label>Festival</label>
      <select id="filter-festival">
        <option value="">All</option>
        {% for f in festivals %}
        <option value="{{ f.id }}">{{ f.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="filter-group">
      <label>Status</label>
      <select id="filter-status">
        <option value="">All</option>
        <option value="unplaced">Unplaced</option>
        <option value="auto">Auto</option>
        <option value="manual">Manual</option>
        <option value="locked">Locked</option>
      </select>
    </div>
    <div id="canvas-artist-list" style="max-height:400px;overflow-y:auto;"></div>
  </div>

  <div id="canvas-main">
    <div id="canvas-toolbar">
      <button class="toolbar-btn" onclick="CanvasApp.autoLayout()">⟳ Auto-layout</button>
      <button class="toolbar-btn" onclick="CanvasApp.toggleClusters()">◈ Clusters</button>
      <button class="toolbar-btn" onclick="CanvasApp.toggleEdges()">⬡ Edges</button>
      <button class="toolbar-btn" onclick="CanvasApp.undo()">↩ Undo</button>
      <button class="toolbar-btn" onclick="CanvasApp.exportPNG()">⬇ Export PNG</button>
      <button class="toolbar-btn" onclick="CanvasApp.toggleDark()">🌓 Theme</button>
    </div>
    <div id="canvas-search">
      <input type="text" id="search-input" placeholder="Search artists..." onkeydown="if(event.key==='Enter')CanvasApp.search()">
    </div>
    <div id="canvas"></div>
    <div id="canvas-inspector"></div>
    <div id="canvas-status">Loading...</div>
  </div>
</div>
<div id="canvas-toast" class="toast"></div>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<script src="{% static 'js/admin-canvas.js' %}"></script>
{% endblock %}
